name: API Test - STG

on:
  repository_dispatch:
    types: [run-api-test-stg]
  workflow_dispatch:
    inputs:
      test_path:
        description: 'Filter test path (kosongkan = jalankan semua)'
        required: false
        default: ''
      notify_telegram:
        description: 'Kirim notifikasi Telegram?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  NODE_VERSION: '20'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  jest-api-test:
    name: Run Jest API Test - STG
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api/bulk-save-contact-jest

    steps:
      # --- 1. Checkout repo QA ---
      - name: Checkout QA repo
        uses: actions/checkout@v4

      # --- 2. Setup Node.js ---
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/bulk-save-contact-jest/package-lock.json

      # --- 3. Install dependencies ---
      - name: Install dependencies
        run: npm ci

      # --- 4. Resolve test path filter ---
      - name: Resolve test path
        id: resolve-path
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TEST_PATH="${{ github.event.inputs.test_path }}"
          else
            TEST_PATH="${{ github.event.client_payload.test_path }}"
          fi
          echo "test_path=${TEST_PATH}" >> $GITHUB_OUTPUT
          echo "Resolved test path: '${TEST_PATH}'"

      # --- 5. Run Jest ---
      - name: Run Jest API tests
        id: jest
        env:
          ENV: stag
        run: |
          TEST_PATH="${{ steps.resolve-path.outputs.test_path }}"
          if [ -n "$TEST_PATH" ]; then
            npx jest "$TEST_PATH" \
              --verbose \
              --forceExit \
              --reporters=default \
              --reporters=jest-junit \
              --json --outputFile=jest-results.json
          else
            npx jest \
              --verbose \
              --forceExit \
              --reporters=default \
              --reporters=jest-junit \
              --json --outputFile=jest-results.json
          fi
        continue-on-error: true

      # --- 6. Parse hasil test ---
      - name: Parse test results
        id: parse
        if: always()
        run: |
          if [ -f jest-results.json ]; then
            TOTAL=$(jq '.numTotalTests' jest-results.json)
            PASSED=$(jq '.numPassedTests' jest-results.json)
            FAILED=$(jq '.numFailedTests' jest-results.json)
            PENDING=$(jq '.numPendingTests' jest-results.json)
            DURATION=$(jq '.testResults[0].perfStats | (.end - .start) / 1000 | floor' jest-results.json 2>/dev/null || echo "0")
          else
            TOTAL=0; PASSED=0; FAILED=0; PENDING=0; DURATION=0
          fi
          echo "total=$TOTAL"       >> $GITHUB_OUTPUT
          echo "passed=$PASSED"     >> $GITHUB_OUTPUT
          echo "failed=$FAILED"     >> $GITHUB_OUTPUT
          echo "pending=$PENDING"   >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "Total: $TOTAL | Passed: $PASSED | Failed: $FAILED | Pending: $PENDING"

      # --- 7. Upload artifact ---
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-report-stg-${{ github.run_number }}
          path: |
            api/bulk-save-contact-jest/junit.xml
            api/bulk-save-contact-jest/jest-results.json
          retention-days: 7

# --- 8. Notifikasi Telegram ---
      - name: Send Telegram notification
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          TOTAL: ${{ steps.parse.outputs.total }}
          PASSED: ${{ steps.parse.outputs.passed }}
          FAILED: ${{ steps.parse.outputs.failed }}
          PENDING: ${{ steps.parse.outputs.pending }}
          DURATION: ${{ steps.parse.outputs.duration }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            BRANCH="${{ github.event.client_payload.branch }}"
            COMMIT="${{ github.event.client_payload.commit }}"
            ACTOR="${{ github.event.client_payload.triggered_by }}"
            SOURCE="Auto Dev push"
          else
            BRANCH="${{ github.ref_name }}"
            COMMIT="${{ github.sha }}"
            ACTOR="${{ github.actor }}"
            SOURCE="Manual trigger"
          fi
 
          SHORT_COMMIT="${COMMIT:0:7}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
 
          if [ "$JOB_STATUS" = "success" ]; then
            STATUS_ICON="passed"
            STATUS_LABEL="PASSED"
          elif [ "$JOB_STATUS" = "failure" ]; then
            STATUS_ICON="failed"
            STATUS_LABEL="FAILED"
          else
            STATUS_ICON="warning"
            STATUS_LABEL="$JOB_STATUS"
          fi
 
          MSG="<b>API Test STG - ${STATUS_LABEL}</b>"
          MSG="${MSG}$(printf '\n')<b>Branch:</b> <code>${BRANCH}</code>"
          MSG="${MSG}$(printf '\n')<b>Commit:</b> <code>${SHORT_COMMIT}</code>"
          MSG="${MSG}$(printf '\n')<b>Actor:</b> ${ACTOR}"
          MSG="${MSG}$(printf '\n')<b>Source:</b> ${SOURCE}"
          MSG="${MSG}$(printf '\n')"
          MSG="${MSG}$(printf '\n')<b>Test Results:</b>"
          MSG="${MSG}$(printf '\n')Passed  : ${PASSED}"
          MSG="${MSG}$(printf '\n')Failed  : ${FAILED}"
          MSG="${MSG}$(printf '\n')Pending : ${PENDING}"
          MSG="${MSG}$(printf '\n')Total   : ${TOTAL}"
          MSG="${MSG}$(printf '\n')Duration: ${DURATION}s"
          MSG="${MSG}$(printf '\n')"
          MSG="${MSG}$(printf '\n')<a href=\"${RUN_URL}\">Lihat detail run</a>"
 
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode text="${MSG}"
 
          echo "Telegram notification sent"
          
      # --- 9. Fail job jika ada test yang gagal ---
      - name: Fail if tests failed
        if: steps.jest.outcome == 'failure'
        run: |
          echo "Ada test yang gagal. Lihat laporan di artifact."
          exit 1

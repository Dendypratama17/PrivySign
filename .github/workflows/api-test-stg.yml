name: API Test - STG

on:
  repository_dispatch:
    types: [run-api-test-stg]
  workflow_dispatch:
    inputs:
      test_path:
        description: 'Filter test path (kosongkan = jalankan semua)'
        required: false
        default: ''
      notify_telegram:
        description: 'Kirim notifikasi Telegram?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  ENV: stag
  BASE_URL: https://stg-public-api.privy.id/privysign
  NODE_VERSION: '20'

jobs:
  jest-api-test:
    name: Run Jest API Test - STG
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --- 1. Checkout repo QA ---
      - name: Checkout QA repo
        uses: actions/checkout@v4

      # --- 2. Setup Node.js ---
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # --- 3. Install dependencies ---
      - name: Install dependencies
        working-directory: api/bulk-save-contact-jest
        run: npm ci

      # --- 4. Resolve test path filter ---
      - name: Resolve test path
        id: resolve-path
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TEST_PATH="${{ github.event.inputs.test_path }}"
          else
            TEST_PATH="${{ github.event.client_payload.test_path }}"
          fi
          echo "test_path=${TEST_PATH}" >> $GITHUB_OUTPUT
          echo "Resolved test path: '${TEST_PATH}'"

     # --- 5. Run Jest ---
      - name: Run Jest API tests
        id: jest
        working-directory: api/bulk-save-contact-jest
        env:
          ENV: ${{ env.ENV }}
          BASE_URL: ${{ env.BASE_URL }}
          AUTH_TYPE: bearer
        run: |
          TEST_PATH="${{ steps.resolve-path.outputs.test_path }}"
          if [ -n "$TEST_PATH" ]; then
            npx jest "$TEST_PATH" \
              --verbose \
              --forceExit \
              --reporters=default \
              --reporters=jest-junit \
              --json --outputFile=jest-results.json
          else
            npx jest \
              --verbose \
              --forceExit \
              --reporters=default \
              --reporters=jest-junit \
              --json --outputFile=jest-results.json
          fi
        continue-on-error: true

      # --- 6. Parse hasil test ---
      - name: Parse test results
        id: parse
        if: always()
        working-directory: api/bulk-save-contact-jest
        run: |
          if [ -f jest-results.json ]; then
            TOTAL=$(jq '.numTotalTests' jest-results.json)
            PASSED=$(jq '.numPassedTests' jest-results.json)
            FAILED=$(jq '.numFailedTests' jest-results.json)
            PENDING=$(jq '.numPendingTests' jest-results.json)
            DURATION=$(jq '.testResults[0].perfStats | (.end - .start) / 1000 | floor' jest-results.json 2>/dev/null || echo "0")
          else
            TOTAL=0; PASSED=0; FAILED=0; PENDING=0; DURATION=0
          fi
          echo "total=$TOTAL"       >> $GITHUB_OUTPUT
          echo "passed=$PASSED"     >> $GITHUB_OUTPUT
          echo "failed=$FAILED"     >> $GITHUB_OUTPUT
          echo "pending=$PENDING"   >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      # --- 7. Upload artifact ---
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-report-stg-${{ github.run_number }}
          path: |
            api/bulk-save-contact-jest/junit.xml
            api/bulk-save-contact-jest/jest-results.json
          retention-days: 7
